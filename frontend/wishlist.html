<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | FarmDirect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="mobile-menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <a href="index.html" class="brand-logo">
          <i class="fa-solid fa-leaf"></i>
          <span>FarmDirect</span>
        </a>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Marketplace</a>
        <a href="farmers-map.html" class="nav-link">Nearby Farmers</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="action-icon-btn"><i class="fa-solid fa-cart-shopping"></i></a>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>
  <div class="backdrop-overlay"></div>

  <main class="container section" style="padding-top:2.5rem;">
    <h1 style="font-size:2rem;font-weight:800;color:var(--text-dark);margin-bottom:2rem;">Your Saved Farm Produce</h1>

    <div id="wishlist-grid" class="product-grid" style="display:grid;grid-template-columns:repeat(4, 1fr);gap:1.5rem;">
      <!-- Loaded dynamically -->
    </div>

    <div id="wishlist-empty-state" class="card" style="display:none;text-align:center;padding:4rem 1.5rem;">
      <i class="fa-regular fa-heart" style="font-size:3.5rem;color:#cbd5e1;margin-bottom:1.25rem;"></i>
      <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:0.5rem;">Your Wishlist is Empty</h2>
      <p style="color:var(--text-muted);margin-bottom:1.5rem;">Explore our seasonal marketplace and save your favorite crops.</p>
      <a href="products.html" class="btn btn-primary">Discover Produce</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadWishlist();
    });

    async function loadWishlist() {
      try {
        const res = await api.get('/wishlist');
        const items = res.data;
        const grid = document.getElementById('wishlist-grid');
        const empty = document.getElementById('wishlist-empty-state');

        if (!items || items.length === 0) {
          empty.style.display = 'block';
          grid.innerHTML = '';
          return;
        }

        empty.style.display = 'none';
        grid.innerHTML = items.map(p => `
          <div class="card product-card">
            <div class="product-thumb">
              <a href="product-details.html?id=${p.id}">
                <img src="${p.images?.[0]?.imageUrl || ''}" alt="${p.name}">
              </a>
              <button class="product-wishlist-btn active" onclick="removeFromWishlist('${p.id}')" title="Remove">
                <i class="fa-solid fa-heart" style="color:var(--danger-color);"></i>
              </button>
            </div>
            <div class="product-body">
              <div class="product-farmer-meta">
                <i class="fa-solid fa-tractor" style="color:var(--secondary-color);"></i>
                <span>${p.farmerName}</span>
              </div>
              <a href="product-details.html?id=${p.id}" class="product-title">${p.name}</a>
              <div class="product-price-row">
                <span class="product-price">₹${p.price}</span>
                <span class="product-unit">/ ${p.unit}</span>
              </div>
              <div class="product-footer-actions">
                <button class="btn btn-primary btn-block btn-sm" onclick="moveToCart('${p.id}')">
                  Move to Cart
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        toast.error('Failed to load wishlist');
      }
    }

    async function removeFromWishlist(id) {
      await api.delete(`/wishlist/${id}`);
      toast.info('Item removed from wishlist');
      window.updateBadges?.();
      loadWishlist();
    }

    async function moveToCart(id) {
      await cart.add(id, 1);
      await removeFromWishlist(id);
    }
  </script>
</body>
</html>
