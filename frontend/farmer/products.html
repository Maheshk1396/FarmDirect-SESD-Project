<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage My Products | Farmer Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="../index.html">
          <i class="fa-solid fa-leaf" style="color:var(--secondary-color);"></i>
          <span>FarmDirect</span>
        </a>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-nav-link">
          <i class="fa-solid fa-gauge-high"></i> Overview
        </a>
        <a href="products.html" class="sidebar-nav-link active">
          <i class="fa-solid fa-boxes-stacked"></i> My Products
        </a>
        <a href="add-product.html" class="sidebar-nav-link">
          <i class="fa-solid fa-plus-circle"></i> Add New Product
        </a>
        <a href="orders.html" class="sidebar-nav-link">
          <i class="fa-solid fa-clipboard-list"></i> Customer Orders
        </a>
        <a href="inventory.html" class="sidebar-nav-link">
          <i class="fa-solid fa-warehouse"></i> Inventory Stock
        </a>
        <a href="earnings.html" class="sidebar-nav-link">
          <i class="fa-solid fa-indian-rupee-sign"></i> Earnings & Payouts
        </a>
        <a href="reviews.html" class="sidebar-nav-link">
          <i class="fa-solid fa-star"></i> Customer Reviews
        </a>
        <a href="profile.html" class="sidebar-nav-link">
          <i class="fa-solid fa-tractor"></i> Farm Profile
        </a>
        <a href="settings.html" class="sidebar-nav-link">
          <i class="fa-solid fa-gear"></i> Settings
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <div class="dashboard-main">
      <header class="dashboard-header">
        <h2 style="font-size:1.3rem;font-weight:800;">My Harvest Catalog</h2>
        <a href="add-product.html" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-plus"></i> Add New Crop / Produce
        </a>
      </header>

      <div class="dashboard-body">
        <div class="table-card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>Stock Available</th>
                  <th>Organic Cert</th>
                  <th>Visibility</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="farmer-products-table-body">
                <tr><td colspan="6" style="text-align:center;padding:2rem;">Loading your farm products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.requireAuth('FARMER')) return;
      loadFarmerProducts();
    });

    async function loadFarmerProducts() {
      try {
        const user = auth.getUser();
        const farmerId = user.farmerProfile?.id;
        const res = await api.get(`/farmers/${farmerId}/products`);
        const products = res.data;
        const tbody = document.getElementById('farmer-products-table-body');

        if (!products || products.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;">No products added yet. <a href="add-product.html" class="btn btn-primary btn-sm" style="margin-left:0.5rem;">Add First Product</a></td></tr>';
          return;
        }

        tbody.innerHTML = products.map(p => `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:0.75rem;">
                <img src="${p.images?.[0]?.imageUrl || ''}" alt="${p.name}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;">
                <div>
                  <strong>${p.name}</strong>
                  <div style="font-size:0.75rem;color:var(--text-muted);">Harvested: ${p.harvestDate ? new Date(p.harvestDate).toLocaleDateString() : 'Recent'}</div>
                </div>
              </div>
            </td>
            <td><strong>₹${p.price}</strong> / ${p.unit}</td>
            <td>
              <span class="badge ${p.stockQuantity > 10 ? 'badge-success' : 'badge-danger'}">
                ${p.stockQuantity} ${p.unit}s
              </span>
            </td>
            <td>
              ${p.isOrganic ? '<span class="badge badge-success"><i class="fa-solid fa-leaf"></i> Organic</span>' : '<span style="color:var(--text-muted);font-size:0.8rem;">Standard</span>'}
            </td>
            <td>
              <span class="badge ${p.isPublished ? 'badge-success' : 'badge-neutral'}">
                ${p.isPublished ? 'Live on Store' : 'Draft'}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-light" style="color:var(--danger-color);" onclick="deleteProduct('${p.id}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        toast.error('Failed to load products');
      }
    }

    async function deleteProduct(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        try {
          await api.delete(`/products/${id}`);
          toast.success('Product deleted successfully');
          loadFarmerProducts();
        } catch (e) {
          toast.error(e.message || 'Could not delete product');
        }
      }
    }
  </script>
</body>
</html>
