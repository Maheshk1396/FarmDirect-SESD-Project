<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order Delivery | FarmDirect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .timeline-step {
      display: flex;
      gap: 1.25rem;
      position: relative;
      padding-bottom: 2rem;
    }
    .timeline-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 17px;
      top: 36px;
      bottom: 0;
      width: 2px;
      background: var(--border-color);
    }
    .timeline-step.completed::after {
      background: var(--secondary-color);
    }
    .timeline-step-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f3f4f6;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      z-index: 2;
    }
    .timeline-step.completed .timeline-step-icon {
      background: #dcfce7;
      color: #166534;
      border: 2px solid var(--secondary-color);
    }
    .timeline-step.active .timeline-step-icon {
      background: var(--primary-color);
      color: #fff;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-leaf"></i>
        <span>FarmDirect</span>
      </a>
      <a href="customer-orders.html" class="btn btn-outline btn-sm">All Orders</a>
    </div>
  </header>

  <main class="container section" style="padding-top:2.5rem;max-width:800px;">
    <h1 style="font-size:2rem;font-weight:800;color:var(--text-dark);margin-bottom:0.5rem;">Live Delivery Tracking</h1>
    <div style="color:var(--text-muted);margin-bottom:2rem;" id="tracking-subtitle">Tracking order shipment...</div>

    <div class="card" style="padding:2.5rem;margin-bottom:2rem;">
      <div id="timeline-container">
        <!-- Rendered by script -->
      </div>
    </div>

    <!-- Multi-Farmer Fulfillments Status -->
    <div class="card" style="padding:2rem;">
      <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:1.25rem;">Direct Farm Dispatch Packages</h2>
      <div id="fulfillments-breakdown-list" style="display:flex;flex-direction:column;gap:1rem;">
        <!-- Injected -->
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id');

      if (!orderId) {
        window.location.href = 'customer-orders.html';
        return;
      }

      try {
        const res = await api.get(`/orders/${orderId}`);
        const ord = res.data;

        document.getElementById('tracking-subtitle').textContent = `Order #${ord.orderNumber} • Placed on ${new Date(ord.createdAt).toLocaleDateString()}`;

        // Build Steps Timeline
        const steps = [
          { key: 'PLACED', title: 'Order Placed & Verified', desc: 'Received and sent to respective local farms.' },
          { key: 'CONFIRMED', title: 'Confirmed by Farmer', desc: 'Farmers accepted order and verified harvest availability.' },
          { key: 'PROCESSING', title: 'Harvesting & Packaging', desc: 'Crops plucked fresh from fields and crated.' },
          { key: 'SHIPPED', title: 'In Express Transit', desc: 'Picked up by courier and on way to your location.' },
          { key: 'DELIVERED', title: 'Delivered to Doorstep', desc: 'Safely delivered to customer.' }
        ];

        const statusOrder = ['PLACED', 'CONFIRMED', 'PROCESSING', 'SHIPPED', 'DELIVERED'];
        const currentIdx = statusOrder.indexOf(ord.status);

        const container = document.getElementById('timeline-container');
        container.innerHTML = steps.map((s, idx) => {
          let stateClass = '';
          if (idx < currentIdx) stateClass = 'completed';
          else if (idx === currentIdx) stateClass = 'active';

          return `
            <div class="timeline-step ${stateClass}">
              <div class="timeline-step-icon">
                ${idx < currentIdx ? '✓' : idx + 1}
              </div>
              <div>
                <strong style="font-size:1rem;color:var(--text-dark);">${s.title}</strong>
                <div style="font-size:0.85rem;color:var(--text-muted);">${s.desc}</div>
              </div>
            </div>
          `;
        }).join('');

        // Render Fulfillments
        const fulContainer = document.getElementById('fulfillments-breakdown-list');
        if (ord.fulfillments && ord.fulfillments.length > 0) {
          fulContainer.innerHTML = ord.fulfillments.map(f => `
            <div style="background:#f8faf5;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:1.25rem;display:flex;justify-content:space-between;align-items:center;">
              <div>
                <strong style="font-size:1rem;color:var(--primary-color);">🌾 ${f.farmName || 'Verified Farm'}</strong>
                <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem;">
                  Courier: ${f.courierName || 'Priority Surface'} • AWB: <strong>${f.trackingNumber || 'Pending'}</strong>
                </div>
              </div>
              <span class="badge ${f.status === 'DELIVERED' ? 'badge-success' : 'badge-info'}">
                ${f.status}
              </span>
            </div>
          `).join('');
        }
      } catch (e) {
        toast.error('Order tracking details not found');
      }
    });
  </script>
</body>
</html>
