<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reviews | Farmer Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="../index.html">
          <i class="fa-solid fa-leaf" style="color:var(--secondary-color);"></i>
          <span>FarmDirect</span>
        </a>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-nav-link">
          <i class="fa-solid fa-gauge-high"></i> Overview
        </a>
        <a href="products.html" class="sidebar-nav-link">
          <i class="fa-solid fa-boxes-stacked"></i> My Products
        </a>
        <a href="orders.html" class="sidebar-nav-link">
          <i class="fa-solid fa-clipboard-list"></i> Customer Orders
        </a>
        <a href="reviews.html" class="sidebar-nav-link active">
          <i class="fa-solid fa-star"></i> Customer Reviews
        </a>
        <a href="profile.html" class="sidebar-nav-link">
          <i class="fa-solid fa-tractor"></i> Farm Profile
        </a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h2 style="font-size:1.3rem;font-weight:800;">Customer Ratings & Product Feedback</h2>
      </header>

      <div class="dashboard-body">
        <div id="farmer-reviews-list" style="display:flex;flex-direction:column;gap:1rem;max-width:800px;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.requireAuth('FARMER')) return;

      try {
        const user = auth.getUser();
        const farmerId = user.farmerProfile?.id;
        const res = await api.get('/reviews', { farmerId });
        const reviews = res.data;
        const container = document.getElementById('farmer-reviews-list');

        if (!reviews || reviews.length === 0) {
          container.innerHTML = '<div class="card" style="padding:2.5rem;text-align:center;color:var(--text-muted);">No customer reviews received yet.</div>';
          return;
        }

        container.innerHTML = reviews.map(r => `
          <div class="card" style="padding:1.5rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <strong>${r.userName}</strong>
              <span style="color:#f59e0b;">${'★'.repeat(r.rating)} (${r.rating}/5)</span>
            </div>
            <p style="font-size:0.95rem;color:var(--text-dark);line-height:1.5;">${r.comment}</p>
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">Posted on ${new Date(r.createdAt).toLocaleDateString()}</div>
          </div>
        `).join('');
      } catch (err) {
        toast.error('Failed to load reviews');
      }
    });
  </script>
</body>
</html>
