<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Customer Profile | FarmDirect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:1rem;">
        <button class="mobile-menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <a href="index.html" class="brand-logo">
          <i class="fa-solid fa-leaf"></i>
          <span>FarmDirect</span>
        </a>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Marketplace</a>
        <a href="farmers-map.html" class="nav-link">Nearby Farmers</a>
        <a href="customer-orders.html" class="nav-link">My Orders</a>
      </nav>

      <div class="nav-actions">
        <a href="wishlist.html" class="action-icon-btn"><i class="fa-regular fa-heart"></i></a>
        <a href="cart.html" class="action-icon-btn"><i class="fa-solid fa-cart-shopping"></i></a>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>
  <div class="backdrop-overlay"></div>

  <main class="container section" style="padding-top:2.5rem;">
    <h1 style="font-size:2rem;font-weight:800;color:var(--text-dark);margin-bottom:2rem;">My Profile & Addresses</h1>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start;">
      
      <!-- Personal Details Form -->
      <div class="card" style="padding:2rem;">
        <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:1.5rem;">Account Information</h2>
        
        <form id="profile-edit-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-fullname" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="prof-email" class="form-control" disabled style="background:#f3f4f6;">
          </div>

          <div class="form-group">
            <label class="form-label">Contact Phone</label>
            <input type="tel" id="prof-phone" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary">Save Profile Changes</button>
        </form>
      </div>

      <!-- Saved Delivery Addresses -->
      <div>
        <div class="card" style="padding:2rem;margin-bottom:1.5rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
            <h2 style="font-size:1.3rem;font-weight:700;">Saved Delivery Addresses</h2>
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('new-addr-form').style.display='block'">+ Add Address</button>
          </div>

          <div id="profile-addresses-list" style="display:flex;flex-direction:column;gap:1rem;">
            <!-- Loaded by script -->
          </div>
        </div>

        <!-- Add Address Form (Hidden by default) -->
        <div class="card" id="new-addr-form" style="display:none;padding:1.75rem;">
          <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:1rem;">Add New Address</h3>
          <form id="add-address-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="new-addr-name" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Mobile</label>
                <input type="tel" id="new-addr-phone" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Street / Colony</label>
              <input type="text" id="new-addr-street" class="form-control" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
              <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" id="new-addr-city" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">PIN Code</label>
                <input type="text" id="new-addr-pin" class="form-control" required maxlength="6">
              </div>
            </div>
            <div style="display:flex;gap:0.75rem;">
              <button type="submit" class="btn btn-primary btn-sm">Save Address</button>
              <button type="button" class="btn btn-light btn-sm" onclick="document.getElementById('new-addr-form').style.display='none'">Cancel</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!auth.requireAuth()) return;
      loadProfile();

      document.getElementById('profile-edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api.put('/profile', {
            fullName: document.getElementById('prof-fullname').value.trim(),
            phone: document.getElementById('prof-phone').value.trim(),
          });
          toast.success('Profile updated successfully!');
        } catch (err) {
          toast.error(err.message || 'Update failed');
        }
      });

      document.getElementById('add-address-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api.post('/profile/addresses', {
            fullName: document.getElementById('new-addr-name').value.trim(),
            phone: document.getElementById('new-addr-phone').value.trim(),
            street: document.getElementById('new-addr-street').value.trim(),
            city: document.getElementById('new-addr-city').value.trim(),
            pinCode: document.getElementById('new-addr-pin').value.trim(),
          });
          toast.success('Address saved!');
          document.getElementById('add-address-form').reset();
          document.getElementById('new-addr-form').style.display = 'none';
          loadProfile();
        } catch (err) {
          toast.error(err.message || 'Failed to save address');
        }
      });
    });

    async function loadProfile() {
      try {
        const res = await api.get('/profile');
        const p = res.data;

        document.getElementById('prof-fullname').value = p.customerProfile?.fullName || '';
        document.getElementById('prof-email').value = p.email || '';
        document.getElementById('prof-phone').value = p.phone || '';

        const addrContainer = document.getElementById('profile-addresses-list');
        if (addrContainer) {
          if (!p.addresses || p.addresses.length === 0) {
            addrContainer.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;">No saved addresses yet.</div>';
          } else {
            addrContainer.innerHTML = p.addresses.map(a => `
              <div style="border:1px solid var(--border-color);border-radius:var(--radius-md);padding:1rem;display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                  <strong>${a.fullName}</strong> (${a.phone})<br>
                  <span style="font-size:0.85rem;color:var(--text-muted);">${a.street}, ${a.city} - ${a.pinCode}</span>
                </div>
                <button class="btn btn-sm btn-light" onclick="deleteAddress('${a.id}')" style="color:var(--danger-color);">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            `).join('');
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteAddress(id) {
      if (confirm('Delete this saved address?')) {
        await api.delete(`/profile/addresses/${id}`);
        toast.info('Address removed');
        loadProfile();
      }
    }
  </script>
</body>
</html>
